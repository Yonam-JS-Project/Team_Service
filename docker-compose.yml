version: "3.8"

services:
  db:
    image: postgres:16
    container_name: travel_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: travel_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  server:
    build: .
    container_name: travel_server
    restart: always
    ports:
      - "80:3000"
    depends_on:
      - db
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: travel_db
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_HOST: ${SERVER_HOST}
      PORT: 3000

volumes:
  pg_data:
