name: Deploy Travel

on:
  push:
    branches:
      - deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup SSH with ssh-agent
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          mkdir -p ~/.ssh
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          
          # base64 디코딩하여 키 파일 생성
          echo "${{ secrets.DEPLOY_KEY }}" | base64 -d > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          
          # ssh-agent에 추가
          echo "Adding key to ssh-agent..."
          ssh-add /tmp/deploy_key
          
          # 키 삭제
          rm /tmp/deploy_key
          
          # known_hosts 추가
          ssh-keyscan -H "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts
          
          echo "SSH setup completed successfully"

      - name: Verify SSH connection
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            "echo 'SSH connection successful'"

      - name: Upload files to server
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            ./ \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:${{ secrets.DEPLOY_PATH }}

      - name: Deploy via Docker Compose
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            export SERVER_HOST=${{ secrets.SERVER_HOST }}
            cd ${{ secrets.DEPLOY_PATH }}
            docker-compose down
            docker-compose build --no-cache
            docker-compose up -d
            docker-compose ps
          ENDSSH
